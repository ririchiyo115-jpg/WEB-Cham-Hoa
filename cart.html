<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - Chạm Hoa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <!-- HEADER: nhóm hãy thay đoạn này bằng header giống index.html để đồng bộ -->
    <header class="bg-light shadow-sm sticky-top">
        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-light py-2">
                <a class="navbar-brand" href="index.html">
                    <img src="images/logo.png" alt="Chạm Hoa" style="height: 50px; width: auto;">
                </a>
                <ul class="navbar-nav ml-auto flex-row">
                    <li class="nav-item mr-3"><a class="nav-link font-weight-bold" href="index.html">Trang chủ</a></li>
                    <li class="nav-item mr-3"><a class="nav-link font-weight-bold" href="products.html">Cửa hàng</a></li>
                    <li class="nav-item">
                        <a href="cart.html" class="nav-link position-relative hover-pink">
                            <i class="fas fa-shopping-cart fa-lg text-pink"></i>
                            <span class="badge badge-pill position-absolute cart-badge">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <h2 class="text-center section-title mb-5">GIỎ HÀNG CỦA BẠN</h2>

        <!-- Giỏ hàng trống -->
        <div id="cart-empty" class="text-center py-5" style="display:none;">
            <i class="fas fa-shopping-basket fa-4x text-pink mb-3"></i>
            <h5 class="mb-3">Giỏ hàng đang trống</h5>
            <a href="products.html" class="btn custom-btn rounded-pill px-4">Chọn hoa ngay</a>
        </div>

        <!-- Giỏ hàng có sản phẩm -->
        <div id="cart-content" class="row" style="display:none;">
            <div class="col-lg-8 mb-4">
                <div class="table-responsive bg-white shadow-sm rounded-lg">
                    <table class="table mb-0">
                        <thead>
                            <tr class="text-center">
                                <th class="text-left">Sản phẩm</th>
                                <th>Đơn giá</th>
                                <th>Số lượng</th>
                                <th>Thành tiền</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="cart-items"></tbody>
                    </table>
                </div>
                <a href="products.html" class="d-inline-block mt-3 text-pink font-weight-bold text-decoration-none">
                    <i class="fas fa-angle-left mr-1"></i> Tiếp tục mua hoa
                </a>
            </div>

            <div class="col-lg-4">
                <div class="bg-white shadow-sm rounded-lg p-4">
                    <h5 class="font-weight-bold mb-4">Tóm tắt đơn hàng</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Tạm tính</span><span id="cart-subtotal">0đ</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Phí giao hàng</span><span id="cart-ship">0đ</span>
                    </div>
                    <p id="ship-note" class="small text-muted mb-2"></p>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <strong>Tổng cộng</strong>
                        <strong class="text-danger" style="font-size:1.3rem;" id="cart-total">0đ</strong>
                    </div>
                    <button id="btn-checkout" class="btn btn-block custom-btn rounded-pill py-2">THANH TOÁN</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="main.js"></script>
    <script src="cart.js"></script>
</body>
</html>
